app:
  port: "7000"
  mode: dev           # dev | prod | test
  jwt_secret: ""      # 见 .env (APP_JWT_SECRET)，prod 环境必须至少32字符
  jwt:
    expire_hours: 2              # access token 有效期（小时）
    refresh_expire_hours: 168    # refresh token 有效期（小时），168 = 7天

db:
  host: 47.108.233.21
  port: 3306
  user: ""        # 见 .env (DB_USER)
  password: ""    # 见 .env (DB_PASSWORD)
  dbname: shop_mall
  max_open_conns: 50
  max_idle_conns: 25
  conn_max_life: 3600       # 秒
  conn_max_idle_time: 600   # 秒
  tls: ""                   # "" | skip-verify | custom

redis:
  host: 47.108.233.21
  port: 6379
  password: ""    # 见 .env (REDIS_PASSWORD)
  db: 0
  tls: false

cors:
  allow_origins:
    - http://localhost:5173
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - X-XSRF-TOKEN
  allow_credentials: true
  max_age: 86400
