# ===========================================
# ShopMall 配置文件
# ===========================================
#
# 所有配置均可通过环境变量覆盖（docker-compose 友好）：
#   APP_PORT / APP_MODE / APP_JWT_SECRET
#   APP_JWT_EXPIRE_HOURS / APP_JWT_REFRESH_EXPIRE_HOURS
#   DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
# ===========================================

app:
  port: "7000"
  mode: dev           # dev | prod | test
  jwt_secret: "shopmall-dev-jwt-secret-key-2026!@#$%^&*"  # prod 环境必须修改，至少32字符
  jwt:
    expire_hours: 2              # access token 有效期（小时）
    refresh_expire_hours: 168    # refresh token 有效期（小时），168 = 7天

db:
  host: 10.211.55.5
  port: 3306
  user: root
  password: admin@zzp
  dbname: shop_mall
  max_open_conns: 50
  max_idle_conns: 25
  conn_max_life: 3600       # 秒
  conn_max_idle_time: 600   # 秒
  tls: ""                   # "" | skip-verify | custom

redis:
  host: 10.211.55.5
  port: 6379
  password: admin@zzp
  db: 0
  tls: false

cors:
  allow_origins:
    - http://localhost:5173
  allow_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Authorization
    - X-XSRF-TOKEN
  allow_credentials: true
  max_age: 86400
